<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爆单MJ共享</title><link rel="stylesheet" href="popup.css"></head><body><main><h1>爆单MJ共享</h1><div class="presence" role="status" aria-live="polite"><span>当前状态：</span><span id="presence" class="status-badge offline">离线</span></div><button id="update-btn" style="width:100%;margin-bottom:.75rem;background:#10b981;font-size:.85rem;padding:.4rem;display:none">更新地址</button><button id="cancel-update-btn" style="width:100%;margin-bottom:0.75rem;background:#6b7280;font-size:0.85rem;padding:0.4rem;display:none">取消检查更新</button><div id="version-expired-message" style="display:none;background:#fee2e2;color:#b91c1c;padding:0.75rem;border-radius:8px;margin-bottom:0.75rem;font-size:0.85rem">当前插件版本已过期，请更新最新版本！</div><section id="login-section"><h2>账号密码登录</h2><form id="credential-form"><label class="field"><span>账号</span><input id="username" autocomplete="username" required></label><label class="field"><span>密码</span><input type="password" id="password" autocomplete="current-password" required></label><label class="field" style="flex-direction:row;align-items:center;margin-bottom:0.5rem"><input type="checkbox" id="remember-me" style="width:auto;margin-right:0.5rem;cursor:pointer"><span style="margin:0;cursor:pointer">记住密码</span></label><button type="submit" id="login-btn">登录并跳转</button><button id="buy-btn" style="margin-top:10px;background:#ef4444">购买</button></form></section><section style="display:none"><h2>已有 Token</h2><label class="field"><span>Token</span><input id="token-input" placeholder="粘贴现有 token"></label><label class="field"><span>到期时间（可选，ISO 或 YYYY-MM-DD HH:mm）</span><input id="expiry-input" placeholder="例如 2025-12-01 20:00"></label><button id="token-btn">直接跳转</button></section><p id="status" aria-live="polite"></p><button id="batch-page-btn" type="button" style="width:100%;margin-top:.5rem;background:linear-gradient(135deg,#4facfe,#00f2fe);color:#0f172a;font-weight:600;border:none;border-radius:8px;padding:.55rem;cursor:pointer">批量提示词任务</button></main><script src="authSession.js"></script><script src="popup.js"></script></body></html>
